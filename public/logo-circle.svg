<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" stroke="#1D4ED8" stroke-width="3" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="51" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="3 3" fill="#F8FAFC"/>
  
  <!-- Central Emblem / Icon -->
  <g transform="translate(60, 46)">
    <!-- Graduation Cap -->
    <path d="M0 -16 L22 -7 L0 2 L-22 -7 Z" fill="#1E40AF"/>
    <path d="M-15 -3 L-15 8 C-15 13 0 17 0 17 C0 17 15 13 15 8 L15 -3 L0 3 Z" fill="#2563EB"/>
    <!-- Tassel -->
    <path d="M16 -5 L19 2 L20 8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="9" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- Typography inside circular badge -->
  <text x="60" y="80" text-anchor="middle" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="15" font-weight="700" fill="#0F172A" letter-spacing="-0.3">
    ডেইলি এক্সাম
  </text>
  <text x="60" y="94" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="9" font-weight="600" fill="#2563EB" letter-spacing="0.2">
    অনলাইন মডেল টেস্ট
  </text>
  <circle cx="60" cy="103" r="2" fill="#DC2626"/>
</svg>
