<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(15, 12)">
    <!-- Base Shield / Hexagon -->
    <rect x="2" y="2" width="72" height="72" rx="18" fill="url(#grad1)" />
    <!-- Bangladesh Red Sun circle accent -->
    <circle cx="56" cy="20" r="9" fill="url(#sunGrad)" opacity="0.95" />
    <!-- Graduation Cap / Exam Book Icon -->
    <path d="M38 18 L18 28 L38 38 L58 28 Z" fill="#FFFFFF" />
    <path d="M24 33 L24 47 C24 53 38 57 38 57 C38 57 52 53 52 47 L52 33 L38 41 Z" fill="#E2E8F0" />
    <!-- Tassel -->
    <path d="M52 28 L56 38 L58 46" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Checkmark Badge -->
    <circle cx="54" cy="56" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <path d="M49 56 L53 60 L60 52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(102, 22)">
    <text x="0" y="30" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F172A" letter-spacing="-0.5">ডেইলি এক্সাম <tspan fill="#059669">বিডি</tspan></text>
    <text x="2" y="52" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748B" letter-spacing="0.5">DAILY ONLINE MCQ EXAM PLATFORM</text>
  </g>
</svg>
